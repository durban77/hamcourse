  <!-- L ag -->
  <line x1="60" y1="30" x2="60" y2="60" stroke="#222" stroke-width="3"/>
  <path d="M60,60 A15,15 0 0 1 60,90 A15,15 0 0 1 60,120 A15,15 0 0 1 60,150"
