<svg xmlns="http://www.w3.org/2000/svg" width="450" height="340" viewBox="0 0 450 340" font-family="sans-serif">
  <!-- antenna -->
  <line x1="85" y1="0" x2="75" y2="10" stroke="#222" stroke-width="2"/>
  <line x1="85" y1="0" x2="95" y2="10" stroke="#222" stroke-width="2"/>
  <line x1="85" y1="10" x2="85" y2="20" stroke="#222" stroke-width="2"/>

  <!-- sor 1: RF erosito -> Kevero <- Oszcillator -->
  <rect x="20" y="20" width="130" height="50" fill="none" stroke="#222" stroke-width="3"/>
  <text x="85" y="50" text-anchor="middle" font-size="16">RF erősítő</text>

  <line x1="150" y1="45" x2="178" y2="45" stroke="#222" stroke-width="3"/>
  <polygon points="180,45 170,39 170,51" fill="#222"/>

  <rect x="180" y="20" width="130" height="50" fill="none" stroke="#222" stroke-width="3"/>
  <text x="245" y="50" text-anchor="middle" font-size="16">Keverő</text>

  <rect x="330" y="25" width="100" height="40" fill="none" stroke="#222" stroke-width="3"/>
  <text x="380" y="50" text-anchor="middle" font-size="14">Oszcillátor</text>
  <line x1="330" y1="45" x2="312" y2="45" stroke="#222" stroke-width="3"/>
  <polygon points="310,45 320,39 320,51" fill="#222"/>

  <!-- sor 1 -> sor 2 (kevero -> KF, ugyanaz az oszlop) -->
  <line x1="245" y1="70" x2="245" y2="138" stroke="#222" stroke-width="3"/>
  <polygon points="245,140 239,130 251,130" fill="#222"/>

  <!-- sor 2: Detektor <- KF erosito -->
  <rect x="180" y="140" width="130" height="50" fill="none" stroke="#222" stroke-width="3"/>
  <text x="245" y="170" text-anchor="middle" font-size="16">KF erősítő</text>

  <line x1="180" y1="165" x2="152" y2="165" stroke="#222" stroke-width="3"/>
  <polygon points="150,165 160,159 160,171" fill="#222"/>

  <rect x="20" y="140" width="130" height="50" fill="none" stroke="#222" stroke-width="3"/>
  <text x="85" y="170" text-anchor="middle" font-size="16">Detektor</text>

  <!-- sor 2 -> sor 3 (Detektor -> HF erosito, ugyanaz az oszlop) -->
  <line x1="85" y1="190" x2="85" y2="258" stroke="#222" stroke-width="3"/>
  <polygon points="85,260 79,250 91,250" fill="#222"/>

  <!-- sor 3: HF erosito -> Hangszoro -->
  <rect x="20" y="260" width="130" height="50" fill="none" stroke="#222" stroke-width="3"/>
  <text x="85" y="290" text-anchor="middle" font-size="16">HF erősítő</text>

  <line x1="150" y1="285" x2="178" y2="285" stroke="#222" stroke-width="3"/>
  <polygon points="180,285 170,279 170,291" fill="#222"/>

  <rect x="180" y="260" width="130" height="50" fill="none" stroke="#222" stroke-width="3"/>
  <text x="245" y="290" text-anchor="middle" font-size="16">Hangszóró</text>
</svg>
