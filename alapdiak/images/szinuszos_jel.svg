<svg xmlns="http://www.w3.org/2000/svg" width="210" height="225" viewBox="0 0 210 225" font-family="sans-serif">
  <line x1="10" y1="100" x2="190" y2="100" stroke="#bbb" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- alap szinuszos jel -->
