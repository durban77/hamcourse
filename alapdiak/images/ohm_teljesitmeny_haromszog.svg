<svg xmlns="http://www.w3.org/2000/svg" width="200" height="470" viewBox="0 0 200 470" font-family="sans-serif">
  <!-- Teljesitmeny-haromszog: P = U x I -->
  <g transform="translate(10,10)">
    <polygon points="90,10 10,150 170,150" fill="none" stroke="#222" stroke-width="4"/>
    <line x1="38.6" y1="100" x2="141.4" y2="100" stroke="#222" stroke-width="4"/>
    <line x1="90" y1="100" x2="90" y2="150" stroke="#222" stroke-width="4"/>
    <text x="90" y="70" text-anchor="middle" font-size="30" font-weight="bold">P</text>
    <text x="55" y="135" text-anchor="middle" font-size="30" font-weight="bold">U</text>
    <text x="125" y="135" text-anchor="middle" font-size="30" font-weight="bold">I</text>
    <text x="90" y="195" text-anchor="middle" font-size="20">Teljesítmény</text>
    <text x="90" y="218" text-anchor="middle" font-size="18">P = U · I</text>
  </g>
  <!-- Ohm-haromszog: U = I x R -->
  <g transform="translate(10,230)">
    <polygon points="90,10 10,150 170,150" fill="none" stroke="#222" stroke-width="4"/>
    <line x1="38.6" y1="100" x2="141.4" y2="100" stroke="#222" stroke-width="4"/>
    <line x1="90" y1="100" x2="90" y2="150" stroke="#222" stroke-width="4"/>
    <text x="90" y="70" text-anchor="middle" font-size="30" font-weight="bold">U</text>
    <text x="55" y="135" text-anchor="middle" font-size="30" font-weight="bold">I</text>
    <text x="125" y="135" text-anchor="middle" font-size="30" font-weight="bold">R</text>
    <text x="90" y="195" text-anchor="middle" font-size="20">Ohm törvénye</text>
    <text x="90" y="218" text-anchor="middle" font-size="18">U = I · R</text>
  </g>
</svg>
