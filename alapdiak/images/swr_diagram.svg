<svg xmlns="http://www.w3.org/2000/svg" width="220" height="340" viewBox="0 0 220 340" font-family="sans-serif">
  <!-- Jo illesztes: nagy elore hullam, kicsi visszavert -->
  <text x="100" y="20" text-anchor="middle" font-size="13">Adó</text>
  <text x="185" y="20" text-anchor="middle" font-size="13">Antenna</text>

  <rect x="20" y="40" width="130" height="28" fill="#1a1a1a"/>
  <polygon points="150,40 150,68 180,54" fill="#1a1a1a"/>
  <text x="85" y="34" text-anchor="middle" font-size="12">előre haladó hullám (nagy)</text>

  <rect x="70" y="100" width="80" height="8" fill="#999"/>
  <polygon points="70,96 70,112 50,104" fill="#999"/>
  <text x="110" y="125" text-anchor="middle" font-size="12" fill="#777">visszavert hullám (kicsi)</text>

  <text x="110" y="150" text-anchor="middle" font-size="15">Jó illesztés (SWR ≈ 1)</text>

  <!-- Rossz illesztes: nagy elore es nagy visszavert hullam is -->
  <text x="100" y="200" text-anchor="middle" font-size="13">Adó</text>
  <text x="185" y="200" text-anchor="middle" font-size="13">Antenna</text>

  <rect x="20" y="220" width="130" height="28" fill="#1a1a1a"/>
  <polygon points="150,220 150,248 180,234" fill="#1a1a1a"/>
  <text x="85" y="214" text-anchor="middle" font-size="12">előre haladó hullám</text>

  <rect x="70" y="270" width="80" height="24" fill="#b33"/>
  <polygon points="70,266 70,298 46,282" fill="#b33"/>
  <text x="110" y="313" text-anchor="middle" font-size="12" fill="#b33">visszavert hullám (nagy!)</text>

  <text x="110" y="332" text-anchor="middle" font-size="15">Rossz illesztés (magas SWR)</text>
</svg>
