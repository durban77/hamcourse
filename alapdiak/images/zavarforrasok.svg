<svg xmlns="http://www.w3.org/2000/svg" width="280" height="280" viewBox="0 0 280 280" font-family="sans-serif">
  <line x1="140" y1="0" x2="140" y2="280" stroke="#ddd" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="0" y1="140" x2="280" y2="140" stroke="#ddd" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- Elektromos berendezes -->
  <rect x="35" y="35" width="60" height="35" fill="none" stroke="#222" stroke-width="2.5"/>
  <polyline points="50,35 58,15 66,35 74,15 82,35" fill="none" stroke="#b33" stroke-width="2"/>
  <text x="65" y="105" text-anchor="middle" font-size="11">Elektromos</text>
  <text x="65" y="120" text-anchor="middle" font-size="11">berendezés</text>

  <!-- Rossz foldeles -->
  <line x1="210" y1="20" x2="210" y2="45" stroke="#222" stroke-width="2"/>
  <line x1="190" y1="45" x2="230" y2="45" stroke="#222" stroke-width="2.5"/>
  <line x1="197" y1="53" x2="223" y2="53" stroke="#222" stroke-width="2.5"/>
  <line x1="204" y1="61" x2="216" y2="61" stroke="#222" stroke-width="2.5"/>
  <line x1="185" y1="15" x2="235" y2="70" stroke="#b33" stroke-width="3"/>
  <line x1="235" y1="15" x2="185" y2="70" stroke="#b33" stroke-width="3"/>
  <text x="210" y="105" text-anchor="middle" font-size="11">Rossz</text>
  <text x="210" y="120" text-anchor="middle" font-size="11">földelés</text>

  <!-- Helytelen illesztes -->
  <line x1="20" y1="195" x2="55" y2="195" stroke="#222" stroke-width="2"/>
  <polyline points="55,195 65,180 75,210 85,180 95,195" fill="none" stroke="#222" stroke-width="2"/>
  <line x1="95" y1="195" x2="115" y2="195" stroke="#222" stroke-width="2"/>
  <line x1="95" y1="175" x2="60" y2="175" stroke="#b33" stroke-width="2" stroke-dasharray="4,3"/>
  <polygon points="55,175 65,170 65,180" fill="#b33"/>
  <text x="65" y="245" text-anchor="middle" font-size="11">Helytelen</text>
  <text x="65" y="260" text-anchor="middle" font-size="11">illesztés</text>

  <!-- Masik ado (interferencia) -->
  <line x1="210" y1="185" x2="210" y2="215" stroke="#222" stroke-width="4"/>
  <circle cx="210" cy="200" r="3" fill="#fff" stroke="#222" stroke-width="1.5"/>
  <path d="M222,182 Q238,200 222,218" fill="none" stroke="#b33" stroke-width="2"/>
  <path d="M228,172 Q252,200 228,228" fill="none" stroke="#b33" stroke-width="2"/>
  <text x="210" y="245" text-anchor="middle" font-size="11">Másik adó</text>
  <text x="210" y="260" text-anchor="middle" font-size="11">(interferencia)</text>
</svg>
