<svg xmlns="http://www.w3.org/2000/svg" width="280" height="280" viewBox="0 0 280 280" font-family="sans-serif">
  <line x1="140" y1="0" x2="140" y2="280" stroke="#ddd" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="0" y1="140" x2="280" y2="140" stroke="#ddd" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- Dipol -->
  <line x1="20" y1="55" x2="120" y2="55" stroke="#222" stroke-width="4"/>
  <circle cx="70" cy="55" r="3" fill="#fff" stroke="#222" stroke-width="2"/>
  <text x="70" y="120" text-anchor="middle" font-size="13">Dipól</text>

  <!-- Felhullamu antenna -->
  <line x1="160" y1="45" x2="260" y2="45" stroke="#222" stroke-width="4"/>
  <circle cx="210" cy="45" r="3" fill="#fff" stroke="#222" stroke-width="2"/>
  <line x1="160" y1="70" x2="260" y2="70" stroke="#555" stroke-width="1.5"/>
  <polygon points="160,70 168,65 168,75" fill="#555"/>
  <polygon points="260,70 252,65 252,75" fill="#555"/>
  <text x="210" y="88" text-anchor="middle" font-size="12">λ/2</text>
  <text x="210" y="118" text-anchor="middle" font-size="11">Félhullámú antenna</text>

  <!-- Fuggoleges antenna -->
  <line x1="70" y1="160" x2="70" y2="220" stroke="#222" stroke-width="4"/>
  <line x1="70" y1="220" x2="45" y2="238" stroke="#222" stroke-width="2"/>
  <line x1="70" y1="220" x2="70" y2="242" stroke="#222" stroke-width="2"/>
  <line x1="70" y1="220" x2="95" y2="238" stroke="#222" stroke-width="2"/>
  <text x="70" y="260" text-anchor="middle" font-size="11">Függőleges antenna</text>

  <!-- Yagi antenna -->
  <line x1="170" y1="195" x2="250" y2="195" stroke="#555" stroke-width="1.5"/>
  <line x1="175" y1="175" x2="175" y2="215" stroke="#222" stroke-width="3"/>
  <line x1="205" y1="180" x2="205" y2="210" stroke="#222" stroke-width="3"/>
  <line x1="235" y1="183" x2="235" y2="207" stroke="#222" stroke-width="3"/>
  <line x1="250" y1="195" x2="268" y2="195" stroke="#222" stroke-width="2"/>
  <polygon points="270,195 262,190 262,200" fill="#222"/>
  <text x="210" y="255" text-anchor="middle" font-size="13">Yagi antenna</text>
</svg>
